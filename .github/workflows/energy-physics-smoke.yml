name: Energy mechanics physical checks
on:
  push:
  pull_request:
jobs:
  energy-physics:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install lightweight MuJoCo dependencies
        run: python -m pip install 'numpy>=1.26,<3' 'mujoco>=3.3,<4' 'gymnasium>=1.0,<2'
      - name: Run real MuJoCo motor-work regression checks
        run: python -m unittest discover -s tests -p 'test_energy_physics.py' -v
